<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>演示传感器2</title>
  <style>
    body { margin: 0; padding: 24px; color: #dce5f2; background: #0b1020; font: 14px/1.7 "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 8px; color: #ffffff; font-size: 26px; }
    h2 { margin: 24px 0 8px; color: #70a5ff; font-size: 17px; }
    .lead { color: #9aabc4; }
    code { color: #8de0b0; }
    .tip { padding: 12px 14px; border-left: 3px solid #5b8cff; background: #111a2d; }
  </style>
</head>
<body>
  <h1>演示传感器2</h1>
  <p class="lead">这是一个同时演示绑定样式、简介和预览图的完整自定义数据插件。</p>
  <h2>模拟数据</h2>
  <p>插件围绕面板中配置的基础温度与基础湿度生成小幅波动，并写入 <code>snapshot.ext.demo_sensor2</code>。</p>
  <h2>屏幕内容</h2>
  <p>绑定样式展示温度、湿度进度条、状态和最近采集时间；温度达到 30℃ 时状态会切换为警告色。</p>
  <p class="tip">导入插件后先测试数据，再单击“同步样式”把绑定样式上传到设备。</p>
</body>
</html>
