<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纯样式时钟</title>
  <style>
    body { margin: 0; padding: 24px; color: #dce5f2; background: #0b1020; font: 14px/1.7 "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 8px; color: #fff; font-size: 26px; }
    h2 { margin: 24px 0 8px; color: #70a5ff; font-size: 17px; }
    code { color: #8de0b0; }
    .tip { padding: 12px 14px; border-left: 3px solid #5b8cff; background: #111a2d; }
  </style>
</head>
<body>
  <h1>纯样式时钟</h1>
  <p>这是一个 <code>type: style</code> 的市场资源，不包含 <code>main.py</code>、采集任务、配置面板或独立 Python 环境。</p>
  <h2>显示内容</h2>
  <p>样式只读取 Monitor 已有快照中的时间、日期、CPU 和内存数据，不依赖任何自定义数据插件。</p>
  <p class="tip">将整个目录压缩为 ZIP 后发布到市场；下载后，在 Monitor 的“屏幕样式”页面选择“上传 PY / ZIP 样式”。</p>
</body>
</html>
